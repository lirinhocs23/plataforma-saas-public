name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Prepare test environment
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=development/' .env
          sed -i 's|^APP_URL=.*|APP_URL=http://localhost:8080|' .env
          sed -i 's/^SESSION_SECURE_COOKIE=.*/SESSION_SECURE_COOKIE=false/' .env
          sed -i 's/^PRIVACY_CONTACT_EMAIL=.*/PRIVACY_CONTACT_EMAIL=privacy@ci.local/' .env
      - name: Start database
        run: docker compose up -d mysql --wait
      - name: Build application
        run: docker compose build app
      - name: Apply migrations
        run: docker compose run --rm app php bin/migrate.php
      - name: Start application
        run: docker compose up -d app --wait
      - name: PHP lint
        run: docker compose exec -T app sh -lc "find bin public src tests -name '*.php' -print0 | xargs -0 -n1 php -l"
      - name: Unit tests
        run: docker compose exec -T app php tests/run.php
      - name: Store status JavaScript tests
        run: node tests/store-status.test.cjs
      - name: HTTP authentication and persistence smoke test
        run: bash tests/smoke.sh http://localhost:8080
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v

